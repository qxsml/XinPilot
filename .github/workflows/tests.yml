name: Python regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -B scripts/verify_source_manifest.py
      - run: python -B scripts/validate_python.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-regression-report
          path: artifacts/python-tests/validation.txt
